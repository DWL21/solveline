# 컨테이너 로그는 용량 한도를 넘으면 오래된 것부터 지운다(개인정보처리방침의 접속 기록 보관과 맞춘다)
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

name: solveline-production
services:
  runner:
    logging: *logging
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    restart: unless-stopped
    # 네트워크가 없다(루프백만). judge와는 공유 볼륨의 unix 소켓으로만 통신한다.
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
      # 히든 테스트셋 캐시: 사용자 코드가 쓰는 /tmp와 나누고 root만 읽는다
      - /var/cache/solveline-testsets:size=224m,mode=0700
    volumes:
      - runner-socket:/run/solveline-runner
    environment:
      RUN_SLOTS: "2"
      TESTSET_CACHE_MB: "200"
      TESTSET_DIR: /var/cache/solveline-testsets
      RUNNER_SOCKET: /run/solveline-runner/runner.sock
      # judge 컨테이너의 node 사용자(gid 1000)만 소켓을 열 수 있다
      RUNNER_SOCKET_GID: "1000"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 512
  # 채점(0007): 제출 대기열·디스패처·테스트셋 캐시. runner를 부르는 것은 judge뿐이다.
  judge:
    logging: *logging
    build:
      context: .
      dockerfile: docker/judge.Dockerfile
    restart: unless-stopped
    # 게이트웨이(default)에만 붙는다. runner는 unix 소켓으로 부른다. 포트를 호스트에 열지 않는다.
    networks: [default]
    # JUDGE_SECRET·R2_PROXY_SECRET(배포 시 생성). 사용자 데이터·로그인 비밀은 받지 않는다.
    env_file:
      - path: /etc/solveline/judge.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8790"
      DATA_DIR: /data
      # 테스트셋을 Worker(/api/internal/r2)를 거쳐 R2에 올린다
      WEB_ORIGIN: https://solveline.simplyimg.com
      # 채점 결과를 보낼 API(Worker, 서명, 성공할 때까지 재시도)
      RESULTS_URL: https://solveline.simplyimg.com
      # runner를 늘리면 쉼표로 더한다 (예: unix:/run/solveline-runner/runner.sock,unix:/run/solveline-runner2/runner.sock)
      RUNNER_URLS: unix:/run/solveline-runner/runner.sock
      RUNNER_SLOTS: "2"
    volumes:
      - /var/lib/solveline:/data
      - runner-socket:/run/solveline-runner
    depends_on:
      runner:
        condition: service_healthy
  web:
    logging: *logging
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"
    depends_on:
      judge:
        condition: service_healthy
volumes:
  runner-socket:
