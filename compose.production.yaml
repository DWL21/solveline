name: codetest-production
services:
  runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    restart: unless-stopped
    # 인터넷이 차단된 내부 네트워크에만 연결한다.
    networks: [sandbox]
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    environment:
      RUN_SLOTS: "2"
      TESTSET_CACHE_MB: "200"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 512
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    networks: [default, sandbox]
    # GitHub Environment(production) secrets·variables로 배포 시 생성된다.
    env_file:
      - path: /etc/codetest/api.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATA_DIR: /data
      WEB_ORIGIN: https://solveline.simplyimg.com
      # runner를 늘리면 쉼표로 더한다 (예: http://runner:8000,http://runner2:8000)
      RUNNER_URLS: http://runner:8000
      RUNNER_SLOTS: "2"
    volumes:
      - /var/lib/codetest:/data
    depends_on:
      runner:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"
    depends_on:
      api:
        condition: service_healthy
networks:
  sandbox:
    internal: true
