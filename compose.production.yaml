# 컨테이너 로그는 용량 한도를 넘으면 오래된 것부터 지운다(개인정보처리방침의 접속 기록 보관과 맞춘다)
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

name: solveline-production
services:
  runner:
    logging: *logging
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    restart: unless-stopped
    # 인터넷이 차단된 내부 네트워크에만 연결한다.
    networks: [sandbox]
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    environment:
      RUN_SLOTS: "2"
      TESTSET_CACHE_MB: "200"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 512
  # 채점(0007): 제출 대기열·디스패처·테스트셋 캐시. runner를 부르는 것은 judge뿐이다.
  judge:
    logging: *logging
    build:
      context: .
      dockerfile: docker/judge.Dockerfile
    restart: unless-stopped
    # runner(sandbox)와 api(default) 사이에 있다. 포트를 호스트에 열지 않는다.
    networks: [default, sandbox]
    # JUDGE_SECRET·R2_PROXY_SECRET(배포 시 생성). 사용자 데이터·로그인 비밀은 받지 않는다.
    env_file:
      - path: /etc/solveline/judge.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8790"
      DATA_DIR: /data
      # 테스트셋을 Worker(/api/internal/r2)를 거쳐 R2에 올린다
      WEB_ORIGIN: https://solveline.simplyimg.com
      # 채점 결과를 보낼 API(서명, 성공할 때까지 재시도)
      RESULTS_URL: http://api:8787
      # runner를 늘리면 쉼표로 더한다 (예: http://runner:8000,http://runner2:8000)
      RUNNER_URLS: http://runner:8000
      RUNNER_SLOTS: "2"
    volumes:
      - /var/lib/solveline:/data
    depends_on:
      runner:
        condition: service_healthy
  api:
    logging: *logging
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    # runner에 직접 닿지 않는다(sandbox 네트워크 밖). 실행은 judge에 맡긴다.
    networks: [default]
    # GitHub Environment(production) secrets·variables로 배포 시 생성된다.
    env_file:
      - path: /etc/solveline/api.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATA_DIR: /data
      WEB_ORIGIN: https://solveline.simplyimg.com
      JUDGE_URL: http://judge:8790
    volumes:
      - /var/lib/solveline:/data
    depends_on:
      judge:
        condition: service_healthy
  web:
    logging: *logging
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"
    depends_on:
      api:
        condition: service_healthy
networks:
  sandbox:
    internal: true
