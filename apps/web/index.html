<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- iOS Safari는 16px보다 작은 입력칸에 초점이 가면 화면을 확대한다. iOS에서만 자동 확대를 막는다(손가락 확대는 그대로 된다). -->
    <script>
      if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name=viewport]').content += ', maximum-scale=1';
      }
    </script>
    <meta name="theme-color" content="#1e1f22" />
    <!-- 테마(lib/theme.ts): 그리기 전에 정해 깜빡이지 않게 한다. 고른 적이 있으면 그 값, 없으면 기기 설정 -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('solveline:theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        if (t === 'light') document.querySelector('meta[name=theme-color]').content = '#ffffff';
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Solveline</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
