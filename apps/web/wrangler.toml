# Cloudflare Pages 프로젝트 solveline 설정. 이 파일이 있으면 대시보드의 바인딩·변수 설정 대신 이 파일을 쓴다(비밀은 대시보드/wrangler secret).
# docs/decisions/0006-catalog-r2-worker.md
name = "solveline"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-23"

# 공용 문제 데이터·히든 테스트셋. Worker만 바인딩으로 읽고 쓴다(pahidc는 /api/internal/r2 로 Worker를 거친다).
[[r2_buckets]]
binding = "CATALOG"
bucket_name = "solveline-catalog"

# 카탈로그를 R2에서 읽는다. 지우고 배포하면 다시 pahidc(API)에서 읽는다(0006 롤백).
[vars]
CATALOG_SOURCE = "r2"

# ─── API를 Worker에서 실행(0007 5단계 전환 때 켠다, 운영자 승인 필요) ───
# 1) npx wrangler d1 create solveline 로 만든 database_id를 아래에 넣고 주석을 푼다.
# 2) npx wrangler d1 migrations apply solveline --remote (스키마: apps/api/migrations)
# 3) Pages 비밀(SESSION_SECRET·GOOGLE_CLIENT_SECRET·ACCESS_PASSWORD·JUDGE_SECRET)과 아래 변수를 넣고 API_MODE = "worker"를 켠다.
# [[d1_databases]]
# binding = "DB"
# database_name = "solveline"
# database_id = "<wrangler d1 create 결과>"
# migrations_dir = "../api/migrations"
