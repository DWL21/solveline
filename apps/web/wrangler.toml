# Cloudflare Pages 프로젝트 solveline 설정. 이 파일이 있으면 대시보드의 바인딩·변수 설정 대신 이 파일을 쓴다(비밀은 대시보드/wrangler secret).
# docs/decisions/0006-catalog-r2-worker.md
name = "solveline"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-23"

# 공용 문제 데이터·히든 테스트셋. Worker만 바인딩으로 읽고 쓴다(pahidc는 /api/internal/r2 로 Worker를 거친다).
[[r2_buckets]]
binding = "CATALOG"
bucket_name = "solveline-catalog"

# ─── API를 Worker에서 실행(0007 5단계, 2026-10-28 전환) ───
# 사용자 데이터는 D1. 스키마는 apps/api/migrations(배포가 wrangler d1 migrations apply로 적용한다).
[[d1_databases]]
binding = "DB"
database_name = "solveline"
database_id = "6abebb04-4276-48ba-8fa6-c22a1c2e5fa4"
migrations_dir = "../api/migrations"

# 비밀(SESSION_SECRET·GOOGLE_CLIENT_SECRET·ACCESS_PASSWORD·JUDGE_SECRET 등)은 배포가 GitHub production 값으로 Pages 비밀에 넣는다.
# API_MODE를 지우고 배포하면 다시 pahidc api(Tunnel)로 넘긴다(롤백: docs/decisions/0007).
[vars]
CATALOG_SOURCE = "r2"
API_MODE = "worker"
WEB_ORIGIN = "https://solveline.simplyimg.com"
# judge는 pahidc 게이트웨이(Tunnel solveline-api 호스트)의 /judge/ 아래. 요청은 JUDGE_SECRET 서명이 있어야 한다.
JUDGE_URL = "https://solveline-api.simplyimg.com/judge"
