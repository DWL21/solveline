# 로컬 Jenkins. 실행: ci/jenkins/run.sh
name: solveline-jenkins
services:
  jenkins:
    build: .
    user: root
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8099}:8080"
    environment:
      JENKINS_HOME: ${JENKINS_HOME_DIR:?}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?}
      JENKINS_BRANCH: ${JENKINS_BRANCH:-main}
    volumes:
      # 호스트와 같은 경로: 파이프라인 안의 docker run -v "$PWD:..."가 호스트 Docker에서도 맞는 경로가 된다
      - ${JENKINS_HOME_DIR}:${JENKINS_HOME_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPO_DIR:?}:/repo:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
