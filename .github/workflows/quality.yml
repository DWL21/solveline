name: Quality
# 품질 파이프라인: 빠른 피드백부터(단위 → 정적 분석 → API·UI 자동화) 실행하고, 결과를 하나의 품질 리포트로 모은다.
# 공개 저장소: GitHub가 호스팅하는 runner만 쓰고(self-hosted 금지), 비밀 값은 쓰지 않는다(테스트 환경 값은 실행마다 임의 생성).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 단위 테스트·커버리지
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 커버리지(래칫 기준 아래로 내려가면 실패)
        run: pnpm --filter @solveline/api test:coverage
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit
          path: |
            apps/api/coverage/
            apps/api/reports/
          retention-days: 14

  static-analysis:
    name: 정적 분석(SonarQube 품질 게이트)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SonarQube(Docker) 분석·품질 게이트
        run: scripts/sonar.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sonar
          path: reports/quality/
          retention-days: 14

  e2e:
    name: API·UI 자동화(Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 브라우저 설치
        run: pnpm --filter @solveline/e2e exec playwright install --with-deps chromium webkit
      - name: 테스트 환경(Docker) 띄우기
        run: scripts/test-env.sh up
      - name: API·UI 자동화
        run: pnpm --filter @solveline/e2e e2e:ci
        env:
          CI: "true"
      - name: 실패 분석용 서버 로그
        if: failure()
        run: scripts/test-env.sh logs > e2e/reports/test-env.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e
          path: e2e/reports/
          retention-days: 14
      - name: 테스트 환경 내리기
        if: always()
        run: scripts/test-env.sh down

  report:
    name: 품질 리포트
    needs: [unit, static-analysis, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: unit
          path: apps/api
        continue-on-error: true
      - uses: actions/download-artifact@v8
        with:
          name: sonar
          path: reports/quality
        continue-on-error: true
      - uses: actions/download-artifact@v8
        with:
          name: e2e
          path: e2e/reports
        continue-on-error: true
      - name: 지표 집계(Step Summary)
        run: node scripts/quality-report.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: quality-report
          path: reports/quality/
          retention-days: 90
