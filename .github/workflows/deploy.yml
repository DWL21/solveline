name: Production deployment
# self-hosted runner(pahidc)는 main 푸시와 수동 실행에서만 쓴다. (pull_request 금지 — 공개 저장소)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solveline-production
  cancel-in-progress: false
jobs:
  deploy:
    # 포크·다른 브랜치에서는 절대 self-hosted runner를 쓰지 않는다.
    if: github.repository == 'DWL21/solveline' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, solveline-production]
    environment:
      name: production
      url: https://solveline.simplyimg.com
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Write /etc/solveline/api.env and judge.env from GitHub Environment
        # 공개 저장소: 서버에 필요한 값만 이름으로 넘긴다(비밀 전체를 꺼내지 않는다). 값은 출력하지 않는다.
        # 새 환경 변수는 apps/api/.env.example, 여기 env, 아래 KEYS(judge가 쓰면 JUDGE_KEYS도)에 함께 추가한다.
        env:
          SESSION_TTL_DAYS: ${{ vars.SESSION_TTL_DAYS }}
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          # 카탈로그 R2 게시(0006). 넷 다 있어야 켜진다. 처음 넣고 배포하면 문제·테스트셋 전체를 R2로 올린다.
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # R2 키 대신 Pages Worker를 거쳐 게시(Pages 비밀 R2_PROXY_SECRET과 같은 값)
          R2_PROXY_SECRET: ${{ secrets.R2_PROXY_SECRET }}
          # API와 judge가 서로의 요청에 붙이는 HMAC 서명 비밀(0007). api.env와 judge.env에 같은 값을 쓴다.
          JUDGE_SECRET: ${{ secrets.JUDGE_SECRET }}
        run: |
          KEYS="ACCESS_PASSWORD SESSION_SECRET SESSION_TTL_DAYS GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET OWNER_EMAIL CONTACT_EMAIL R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_PROXY_SECRET JUDGE_SECRET"
          # judge는 서명 비밀과 테스트셋을 올릴 R2 설정만 받는다(사용자 데이터·로그인 비밀은 주지 않는다)
          JUDGE_KEYS="JUDGE_SECRET R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_PROXY_SECRET"
          REQUIRED="ACCESS_PASSWORD SESSION_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET JUDGE_SECRET"
          for k in $REQUIRED; do
            [ -n "${!k}" ] || { echo "production 환경에 $k 가 없습니다." >&2; exit 1; }
          done
          sudo install -d -m 700 -o root -g root /etc/solveline
          write_env() {
            local file=$1 k v
            for k in $2; do
              v="${!k}"
              if [ -n "$v" ]; then printf '%s=%s\n' "$k" "${v//$'\n'/}"; fi
            done | sudo tee "$file.new" >/dev/null
            sudo chmod 600 "$file.new"
            sudo mv "$file.new" "$file"
            echo "$(basename "$file") keys: $(sudo cut -d= -f1 "$file" | tr '\n' ' ')"
          }
          write_env /etc/solveline/api.env "$KEYS"
          write_env /etc/solveline/judge.env "$JUDGE_KEYS"
      - name: Build web (Cloudflare Pages)
        env:
          PATH: /home/ubuntu/.local/node/bin:/usr/local/bin:/usr/bin:/bin
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin"
          export PATH="$RUNNER_TEMP/corepack-bin:$PATH"
          pnpm install --frozen-lockfile --filter @solveline/web... --filter @solveline/api...
          pnpm --filter @solveline/web build
          # API를 함께 묶은 Pages Worker(apps/web/dist/_worker.js, 0007)
          pnpm --filter @solveline/api build:worker
      - name: Deploy API, judge and runner
        run: bash scripts/deploy-production.sh
      - name: Sync Pages secrets (Worker API)
        # Worker 안의 API가 쓰는 값을 GitHub production 값 그대로 Pages 비밀에 넣는다(pahidc와 같은 SESSION_SECRET → 로그인 유지).
        # 값은 출력하지 않는다. 임시 파일은 600이고 바로 지운다.
        env:
          PATH: /home/ubuntu/.local/node/bin:/usr/local/bin:/usr/bin:/bin
          SESSION_TTL_DAYS: ${{ vars.SESSION_TTL_DAYS }}
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          JUDGE_SECRET: ${{ secrets.JUDGE_SECRET }}
          R2_PROXY_SECRET: ${{ secrets.R2_PROXY_SECRET }}
        working-directory: apps/web
        run: |
          umask 077
          f="$RUNNER_TEMP/pages-secrets.json"
          python3 -c 'import json, os
          keys = "SESSION_TTL_DAYS ACCESS_PASSWORD SESSION_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET OWNER_EMAIL CONTACT_EMAIL JUDGE_SECRET R2_PROXY_SECRET".split()
          print(json.dumps({k: os.environ[k] for k in keys if os.environ.get(k)}))' > "$f"
          npx --yes wrangler@4.151.0 pages secret bulk "$f" --project-name solveline >/dev/null
          rm -f "$f"
          echo "Pages 비밀을 맞췄습니다."
      - name: Apply D1 migrations
        env:
          PATH: /home/ubuntu/.local/node/bin:/usr/local/bin:/usr/bin:/bin
          CI: "true"
        working-directory: apps/web
        run: npx --yes wrangler@4.151.0 d1 migrations apply solveline --remote
      - name: One-time move of user data from SQLite to D1
        # 0007 5단계. 한 번만 한다(/var/lib/solveline/.d1-migrated). 예전 api를 멈춰 쓰기를 막고, SQLite를 SQL로 내보내 D1에 넣은 뒤
        # 표마다 행 수를 맞춰 본다. 어느 단계든 실패하면 예전 api를 다시 띄우고 실패로 끝낸다(Pages는 바뀌지 않는다).
        env:
          PATH: /home/ubuntu/.local/node/bin:/usr/local/bin:/usr/bin:/bin
          CI: "true"
        working-directory: apps/web
        run: |
          set -euo pipefail
          MARK=/var/lib/solveline/.d1-migrated
          if sudo test -f "$MARK"; then echo "이미 D1로 옮겼습니다."; exit 0; fi
          COMPOSE=(sudo docker compose -f ../../compose.production.yaml)
          restore() { echo "D1 이전 실패: 예전 api를 다시 띄웁니다." >&2; "${COMPOSE[@]}" --profile legacy up -d api || true; }
          trap restore ERR
          # 내보내기 도구가 든 api 이미지를 먼저 만든다(멈추는 시간을 줄인다)
          "${COMPOSE[@]}" --profile legacy build api
          # 쓰기를 멈춘다(점검 시작). Pages가 Worker API로 바뀔 때까지 API가 잠시 응답하지 않는다.
          "${COMPOSE[@]}" --profile legacy stop api
          "${COMPOSE[@]}" --profile legacy run --rm --no-deps -T api node --import tsx scripts/d1-export.ts /data/solveline.db /data/d1-import.sql | tee "$RUNNER_TEMP/d1-export.log"
          umask 077
          # 복사본은 runner 사용자 것이어야 wrangler가 읽는다(그래서 redirect는 sudo 밖에서)
          # shellcheck disable=SC2024
          sudo cat /var/lib/solveline/d1-import.sql > "$RUNNER_TEMP/d1-import.sql"
          npx --yes wrangler@4.151.0 d1 execute solveline --remote --yes --file "$RUNNER_TEMP/d1-import.sql" >/dev/null
          # 내보낸 행 수와 D1의 행 수가 표마다 같은지 본다
          Q="SELECT 'users' t, COUNT(*) n FROM users UNION ALL SELECT 'problems', COUNT(*) FROM problems UNION ALL SELECT 'user_problems', COUNT(*) FROM user_problems UNION ALL SELECT 'submissions', COUNT(*) FROM submissions UNION ALL SELECT 'sessions', COUNT(*) FROM sessions UNION ALL SELECT 'collections', COUNT(*) FROM collections UNION ALL SELECT 'folders', COUNT(*) FROM folders"
          npx --yes wrangler@4.151.0 d1 execute solveline --remote --json --command "$Q" > "$RUNNER_TEMP/d1-counts.json"
          python3 - "$RUNNER_TEMP/d1-export.log" "$RUNNER_TEMP/d1-counts.json" <<'PY'
          import json, re, sys
          exported = dict((t, int(n)) for t, n in re.findall(r'(\w+) (\d+)', open(sys.argv[1]).read().split(':', 1)[1].split('(')[0]))
          d1 = {r['t']: r['n'] for r in json.load(open(sys.argv[2]))[0]['results']}
          bad = {t: (exported.get(t), n) for t, n in d1.items() if exported.get(t) != n}
          print('D1 행 수:', d1)
          sys.exit(f'행 수가 다릅니다: {bad}' if bad else 0)
          PY
          rm -f "$RUNNER_TEMP/d1-import.sql" "$RUNNER_TEMP/d1-counts.json"
          sudo rm -f /var/lib/solveline/d1-import.sql
          # 예전 api 컨테이너는 지우고(이미지·DB 파일은 남긴다) 표시를 남긴다
          "${COMPOSE[@]}" --profile legacy rm -f api
          sudo touch "$MARK"
          trap - ERR
          echo "D1로 옮겼습니다."
      - name: Deploy web and Worker API (Cloudflare Pages)
        env:
          PATH: /home/ubuntu/.local/node/bin:/usr/local/bin:/usr/bin:/bin
        working-directory: apps/web
        run: npx --yes wrangler@4.151.0 pages deploy dist --project-name solveline --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify public deployment
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://solveline-api.simplyimg.com/judge/health
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://solveline.simplyimg.com/api/health
          # Worker API → (서명) → judge → runner까지 닿는지
          for i in $(seq 1 12); do
            if curl --fail --silent https://solveline.simplyimg.com/api/runtime | grep -q '"runner":"up"'; then echo "runtime up"; break; fi
            [ "$i" = 12 ] && { echo "Worker API가 judge에 닿지 않습니다." >&2; exit 1; }
            sleep 5
          done
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://solveline.simplyimg.com/ -o /dev/null
