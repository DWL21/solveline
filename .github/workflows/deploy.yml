name: Production deployment
# self-hosted runner(pahidc)는 main 푸시와 수동 실행에서만 쓴다. (pull_request 금지 — 공개 저장소)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solveline-production
  cancel-in-progress: false
jobs:
  deploy:
    # 포크·다른 브랜치에서는 절대 self-hosted runner를 쓰지 않는다.
    if: github.repository == 'DWL21/solveline' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, solveline-production]
    environment:
      name: production
      url: https://solveline.simplyimg.com
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Write /etc/solveline/judge.env from GitHub Environment
        # 공개 저장소: 서버에 필요한 값만 이름으로 넘긴다(비밀 전체를 꺼내지 않는다). 값은 출력하지 않는다.
        # pahidc에는 judge만 있으므로 서명 비밀과 테스트셋을 올릴 R2 설정만 쓴다(사용자 데이터·로그인 비밀은 주지 않는다).
        # Worker API가 쓰는 값은 아래 "Sync Pages secrets"에서 Pages 비밀로 넣는다.
        env:
          # 카탈로그 R2 게시(0006). R2 키 넷이 다 있을 때만 키로 직접 올리고, 없으면 Worker를 거친다.
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # R2 키 대신 Pages Worker를 거쳐 게시(Pages 비밀 R2_PROXY_SECRET과 같은 값)
          R2_PROXY_SECRET: ${{ secrets.R2_PROXY_SECRET }}
          # Worker API와 judge가 서로의 요청에 붙이는 HMAC 서명 비밀(0007). Pages 비밀과 같은 값이다.
          JUDGE_SECRET: ${{ secrets.JUDGE_SECRET }}
        run: |
          JUDGE_KEYS="JUDGE_SECRET R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_PROXY_SECRET"
          [ -n "$JUDGE_SECRET" ] || { echo "production 환경에 JUDGE_SECRET 이 없습니다." >&2; exit 1; }
          sudo install -d -m 700 -o root -g root /etc/solveline
          f=/etc/solveline/judge.env
          for k in $JUDGE_KEYS; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s=%s\n' "$k" "${v//$'\n'/}"; fi
          done | sudo tee "$f.new" >/dev/null
          sudo chmod 600 "$f.new"
          sudo mv "$f.new" "$f"
          echo "judge.env keys: $(sudo cut -d= -f1 "$f" | tr '\n' ' ')"
      - name: Build web (Cloudflare Pages)
        env:
          PATH: /home/ubuntu/.local/node/bin:/usr/local/bin:/usr/bin:/bin
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin"
          export PATH="$RUNNER_TEMP/corepack-bin:$PATH"
          pnpm install --frozen-lockfile --filter @solveline/web... --filter @solveline/api...
          pnpm --filter @solveline/web build
          # API를 함께 묶은 Pages Worker(apps/web/dist/_worker.js, 0007)
          pnpm --filter @solveline/api build:worker
      - name: Deploy API, judge and runner
        run: bash scripts/deploy-production.sh
      - name: Sync Pages secrets (Worker API)
        # Worker 안의 API가 쓰는 값을 GitHub production 값 그대로 Pages 비밀에 넣는다(pahidc와 같은 SESSION_SECRET → 로그인 유지).
        # 값은 출력하지 않는다. 임시 파일은 600이고 바로 지운다.
        env:
          PATH: /home/ubuntu/.local/node/bin:/usr/local/bin:/usr/bin:/bin
          SESSION_TTL_DAYS: ${{ vars.SESSION_TTL_DAYS }}
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          JUDGE_SECRET: ${{ secrets.JUDGE_SECRET }}
          R2_PROXY_SECRET: ${{ secrets.R2_PROXY_SECRET }}
        working-directory: apps/web
        run: |
          umask 077
          f="$RUNNER_TEMP/pages-secrets.json"
          python3 -c 'import json, os
          keys = "SESSION_TTL_DAYS ACCESS_PASSWORD SESSION_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET OWNER_EMAIL CONTACT_EMAIL JUDGE_SECRET R2_PROXY_SECRET".split()
          print(json.dumps({k: os.environ[k] for k in keys if os.environ.get(k)}))' > "$f"
          npx --yes wrangler@4.151.0 pages secret bulk "$f" --project-name solveline >/dev/null
          rm -f "$f"
          echo "Pages 비밀을 맞췄습니다."
      - name: Apply D1 migrations
        env:
          PATH: /home/ubuntu/.local/node/bin:/usr/local/bin:/usr/bin:/bin
          CI: "true"
        working-directory: apps/web
        run: npx --yes wrangler@4.151.0 d1 migrations apply solveline --remote
      - name: Remove legacy user data after the rollback window
        # 0007 5단계 전환(.d1-migrated, 2026-10-28)에서 롤백용으로 남긴 예전 사용자 데이터와 로그인 비밀을 지운다.
        # 전환 뒤 24시간이 지나지 않았으면 건너뛴다(다음 배포에서 지운다). 한 번 지우면 .legacy-removed를 남긴다.
        # 테스트셋 파일(testsets/, backups/**/testsets)·커리큘럼 JSON·judge 대기열(judge/)은 남긴다.
        run: |
          set -euo pipefail
          DATA=/var/lib/solveline
          if sudo test -f "$DATA/.legacy-removed"; then echo "예전 데이터는 이미 지웠습니다."; exit 0; fi
          if ! sudo test -f "$DATA/.d1-migrated"; then echo "D1 전환 표시가 없습니다. 지우지 않습니다." >&2; exit 1; fi
          if [ -z "$(sudo find "$DATA/.d1-migrated" -mmin +1440)" ]; then
            echo "전환 뒤 24시간이 지나지 않았습니다(롤백 기간). 다음 배포에서 지웁니다."
            exit 0
          fi
          # 예전 SQLite와 DB 스냅숏(사용자 데이터). judge/ 아래(judge.db)는 건드리지 않는다.
          # (-delete는 -depth를 켜서 -prune이 듣지 않으므로 경로 조건으로 뺀다)
          sudo find "$DATA" -type f ! -path "$DATA/judge/*" \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.db-journal' \) -print -delete
          # 꺼진 예전 api의 로그인 비밀(SESSION_SECRET·GOOGLE_CLIENT_SECRET·ACCESS_PASSWORD)
          sudo rm -fv /etc/solveline/api.env /etc/solveline/api.env.new
          # 예전 api 컨테이너(남아 있다면)와 이미지
          sudo docker ps -aq --filter label=com.docker.compose.project=solveline-production --filter label=com.docker.compose.service=api | xargs -r sudo docker rm -f
          sudo docker image rm solveline-production-api:latest 2>/dev/null || echo "예전 api 이미지가 없습니다."
          sudo touch "$DATA/.legacy-removed"
          echo "남은 데이터: $(sudo du -sh "$DATA" | cut -f1)"
      - name: Deploy web and Worker API (Cloudflare Pages)
        env:
          PATH: /home/ubuntu/.local/node/bin:/usr/local/bin:/usr/bin:/bin
        working-directory: apps/web
        run: npx --yes wrangler@4.151.0 pages deploy dist --project-name solveline --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify public deployment
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://solveline-api.simplyimg.com/judge/health
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://solveline.simplyimg.com/api/health
          # Worker API → (서명) → judge → runner까지 닿는지
          for i in $(seq 1 12); do
            if curl --fail --silent https://solveline.simplyimg.com/api/runtime | grep -q '"runner":"up"'; then echo "runtime up"; break; fi
            [ "$i" = 12 ] && { echo "Worker API가 judge에 닿지 않습니다." >&2; exit 1; }
            sleep 5
          done
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://solveline.simplyimg.com/ -o /dev/null
