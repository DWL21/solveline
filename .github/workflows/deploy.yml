name: Production deployment
# self-hosted runner(pahidc)는 main 푸시와 수동 실행에서만 쓴다. (pull_request 금지 — 공개 저장소)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codetest-production
  cancel-in-progress: false
jobs:
  deploy:
    # 포크·다른 브랜치에서는 절대 self-hosted runner를 쓰지 않는다.
    if: github.repository == 'DWL21/codetest' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, codetest-production]
    environment:
      name: production
      url: https://codetest.simplyimg.com
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Write /etc/codetest/api.env from GitHub Environment
        # production 환경의 secrets·variables를 모두 env 파일로 기록한다. 값은 출력하지 않는다.
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          sudo install -d -m 700 -o root -g root /etc/codetest
          python3 - <<'PY' | sudo tee /etc/codetest/api.env.new >/dev/null
          import json, os, re
          merged = {**json.loads(os.environ["VARS_JSON"] or "{}"), **json.loads(os.environ["SECRETS_JSON"] or "{}")}
          for k in sorted(merged):
              if k == "GITHUB_TOKEN" or k.startswith(("ACTIONS_", "RUNNER_")) or not re.fullmatch(r"[A-Z][A-Z0-9_]*", k):
                  continue
              v = str(merged[k]).replace("\n", "")
              print(f"{k}={v}")
          PY
          sudo chmod 600 /etc/codetest/api.env.new
          sudo mv /etc/codetest/api.env.new /etc/codetest/api.env
          echo "env keys: $(sudo cut -d= -f1 /etc/codetest/api.env | tr '\n' ' ')"
      - name: Deploy
        run: bash scripts/deploy-production.sh
      - name: Verify public deployment
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://codetest.simplyimg.com/api/health
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://codetest.simplyimg.com/ -o /dev/null
