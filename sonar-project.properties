# SonarQube 정적 분석 설정. 실행: scripts/sonar.sh (Docker로 서버를 띄워 분석하고 품질 게이트를 확인한다)
sonar.projectKey=solveline
sonar.projectName=Solveline
sonar.sourceEncoding=UTF-8

sonar.sources=apps/api/src,apps/web/src,packages/shared/src,runner
sonar.tests=apps/api/test,e2e/tests,e2e/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/reports/**,runner/java/**
sonar.test.inclusions=apps/api/test/**,e2e/**

# 커버리지는 단위 테스트가 대상인 API 코드에 대해 잰다.
# 화면(web)·runner(Python)는 E2E·runner 자체 검사로 검증하므로 단위 커버리지 계산에서 뺀다(지표 왜곡 방지).
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
sonar.coverage.exclusions=apps/web/**,runner/**,packages/shared/**,apps/api/src/main.ts

# 중복 코드 계산에서 테스트·생성 코드 제외
sonar.cpd.exclusions=apps/api/test/**,e2e/**
sonar.python.version=3.13

# 오탐 처리(근거를 남기고 규칙 단위로 좁게 끈다)
#  tw: Tailwind CSS v4의 @utility·@theme 지시어를 CSS 표준 밖이라 "모르는 at-rule"로 본다(빌드 도구가 처리한다)
sonar.issue.ignore.multicriteria=tw
sonar.issue.ignore.multicriteria.tw.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.tw.resourceKey=**/*.css
