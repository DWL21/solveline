# SonarQube 정적 분석 설정. 실행: scripts/sonar.sh (Docker로 서버를 띄워 분석하고 품질 게이트를 확인한다)
sonar.projectKey=solveline
sonar.projectName=Solveline
sonar.sourceEncoding=UTF-8

sonar.sources=apps/api/src,apps/web/src,packages/shared/src,runner
sonar.tests=apps/api/test,e2e/tests,e2e/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/reports/**,runner/java/**
sonar.test.inclusions=apps/api/test/**,e2e/**

# 커버리지는 단위 테스트가 대상인 API 코드에 대해 잰다.
# 화면(web)·runner(Python)는 E2E·runner 자체 검사로 검증하므로 단위 커버리지 계산에서 뺀다(지표 왜곡 방지).
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
sonar.coverage.exclusions=apps/web/**,runner/**,packages/shared/**,apps/api/src/main.ts

# 중복 코드 계산에서 테스트·생성 코드 제외
sonar.cpd.exclusions=apps/api/test/**,e2e/**
sonar.python.version=3.13

# 오탐 처리(근거를 남기고 규칙 단위로 좁게 끈다)
#  tw: Tailwind CSS v4의 @utility·@theme 지시어를 CSS 표준 밖이라 "모르는 at-rule"로 본다(빌드 도구가 처리한다)
#  sp1~3: 창 분할 막대는 WAI-ARIA Window Splitter 패턴(초점을 받는 role="separator" + aria-valuenow, 방향키로 조절)이다.
#         초점을 받는 separator는 위젯인데 규칙은 정적 구분선(<hr>)으로 보고 tabIndex·키 처리를 지적한다
#  harness: Python 실행기는 사용자 코드가 올린 예외를 종류와 관계없이(SystemExit·BaseException 포함) result.json에 보고해야 한다.
#           다시 올리면 종료 코드가 바뀌어 runner가 결과를 읽지 않으므로 의도적으로 BaseException을 잡는다
sonar.issue.ignore.multicriteria=tw,sp1,sp2,sp3,harness
sonar.issue.ignore.multicriteria.tw.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.tw.resourceKey=**/*.css
sonar.issue.ignore.multicriteria.sp1.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.sp1.resourceKey=apps/web/src/components/Splitter.tsx
sonar.issue.ignore.multicriteria.sp2.ruleKey=typescript:S6847
sonar.issue.ignore.multicriteria.sp2.resourceKey=apps/web/src/components/Splitter.tsx
sonar.issue.ignore.multicriteria.sp3.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.sp3.resourceKey=apps/web/src/components/Splitter.tsx
sonar.issue.ignore.multicriteria.harness.ruleKey=python:S5754
sonar.issue.ignore.multicriteria.harness.resourceKey=runner/py_harness.py
