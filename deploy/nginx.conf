# API 전용 Cloudflare Tunnel → 127.0.0.1:8083 → API 게이트웨이.
# 예전 주소(codetest.simplyimg.com)는 새 이름 주소로 보낸다
server {
    listen 80;
    server_name codetest.simplyimg.com;
    return 301 https://solveline.simplyimg.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # 터널(Cloudflare)까지 가는 데이터를 줄인다. Cloudflare는 받은 그대로 또는 다시 압축해 브라우저로 보낸다.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # 컨테이너 재생성으로 api IP가 바뀌어도 다시 조회한다.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8787;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        # 큰 히든 테스트셋(효율성 케이스) 업로드를 위해 넉넉히 둔다
        client_max_body_size 32m;
        # API(Hono)도 같은 이름의 헤더를 보내므로 nginx 값 하나만 남긴다.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    location / {
        return 404;
    }
}
