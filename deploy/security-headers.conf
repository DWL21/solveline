# 모든 응답에 붙는 보안 헤더. nginx는 location에 add_header가 하나라도 있으면
# server 블록의 add_header를 상속하지 않으므로, add_header가 있는 블록마다 이 파일을 include한다.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
